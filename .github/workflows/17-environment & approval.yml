name: 17-environment & approval
on: 
  workflow_dispatch:
  push: 
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: building the env
        run: |
          echo "artifact building"
          
  deploy_staging:
     needs: build
     runs-on: ubuntu-latest
     environment:
       name: staging
     steps:
       - name: deploying staging
         run: |
           echo "printing secret for staging '${{ secrets.PASSWORD }}'"
           echo "printing variable for staging '${{ vars.NAME }}'"
    
  deploy_production:
      needs: deploy_staging
      runs-on: ubuntu-latest
      environment:
        name: production
      steps:
        - name: deploying production
          run: |
            echo "printing secret for production '${{secrets.TOKEN}}'
            echo "printing variable for production '${{vars.COMPANY}}'"
