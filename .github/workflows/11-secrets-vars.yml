# 14 - Secrets
# NEVER hard-code passwords, tokens, or API keys in a workflow file.
# Store them in:  repo Settings -> Secrets and variables -> Actions -> New repository secret
# Then read them with the `secrets` context: ${{ secrets.NAME }}
#
# For this demo, first create a secret named MY_API_KEY with any value.
#
# SECURITY NOTES:
#   * GitHub automatically MASKS secret values in logs (they show as ***).
#   * Never `echo` a secret directly — pass it via env and use it in a command.
#   * secrets are NOT passed to workflows triggered by forked-repo pull requests.



name: 11-secrets-vars
on:
  workflow_dispatch
jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - name: secrets_variable
        env:
          secrets_var: ${{secrets.KEYVAULT_SECRETS}}
        run: |
          if [ -z "$secrets_var" ]; then
            echo "secrets_var is not set pls add it to repo settings"
            exit 1
          fi
          echo "secrets_var is available Length is ${#secrets_var} characters"
          echo "Even if I try to print it, GitHub masks it: $secrets_var"

      - name: realistic print secrets
        env:
          secrets_var : ${{secrets.KEYVAULT_SECRETS}}
        run: |
          # e.g. curl -H "Authorization: Bearer $secrets_var" https://api.example.com
          echo "Would call an API using the secret from the environment."

      - name: Confirm the variable is present
        env:
          CHANNEL_NAME: ${{ vars.VARS_SECRET }}
        run: |
          if [ -z "$CHANNEL_NAME" ]; then
            echo "❌ Variable VARS_SECRET is not set. Add it in repo settings."
            exit 1
          fi
          echo "✅ Variable is available. Length is ${#CHANNEL_NAME} characters."
          echo "Even if I try to print it, since it is a variable GitHub prints it: $CHANNEL_NAME"
