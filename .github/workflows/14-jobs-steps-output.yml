#
# THE THREE-STEP CHAIN (this is the whole lesson):
#
#   1. A step writes to the $GITHUB_OUTPUT file  ->  echo "key=value" >> "$GITHUB_OUTPUT"
#   2. The JOB re-exports it under `outputs:`    ->  outputs: {name: "${{ steps.<id>.outputs.key }}"}
#   3. A downstream job reads it via `needs`     ->  ${{ needs.<job_id>.outputs.name }}
#
# Miss step 2 and you get an empty string — the single most common mistake
# here. Step outputs are visible only INSIDE their own job until you promote
# them to job outputs.
#
# ALSO NOTE:
#   * The step producing the output MUST have an `id:`.
#   * `::set-output::` is dead. It was disabled in 2023. Use $GITHUB_OUTPUT.
#   * Outputs are always STRINGS. "true" is a string, not a boolean.
#   * Outputs that contain a SECRET are redacted and arrive empty. Do not
#     try to smuggle credentials between jobs this way.

#multi line 
#Output name:  changelog

#Output value:
#- Added job outputs
#- Fixed the build

name: 14-jobs-steps-output
on: workflow_dispatch
jobs:
  job1:
    runs-on: ubuntu-latest

    outputs:
      stage: ${{steps.step1.outputs.Stage}}
      version: ${{steps.step1.outputs.version}}
      name: ${{steps.step1.outputs.Name}}

    env: 
      stage: "dev"
      name: "bharath"
    steps:
      - name: allocate vars
        id: step1
        run: |
          echo Stage=$stage >> "$GITHUB_OUTPUT"
          echo version=1.2.${{github.run_number}} >> "$GITHUB_OUTPUT"
          echo Name=$name >> "$GITHUB_OUTPUT"
        
      - name: consuming step 1
        id: step2
        run: |
           echo "printing stage ${{steps.step1.outputs.Stage}}"
           echo "printing version ${{steps.step1.outputs.version}}"
           echo "printing Name ${{steps.step1.outputs.Name}}"

      - name: printing multi-line
        id: multi
        run: |
          {
            echo "changelog <<CHANGELOG_EOF"
            echo "Added job outputs"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  job2: 
    runs-on: ubuntu-latest
    needs: job1
    if: needs.job1.outputs.version != ''
    steps: 
      - name: deploying
        run: echo "deploying the application"

      
